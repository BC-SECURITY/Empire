name: LaunchAgent
authors:
  - name: Chris Ross
    handle: '@xorrior'
    link: https://twitter.com/xorrior
description: |
  Creates and installs a macOS LaunchAgent plist file to establish persistence
  across user sessions and system reboots. The LaunchAgent is configured to
  automatically start the Empire agent when the user logs in, providing
  continuous access to the compromised system. The module creates a properly
  formatted plist file with the specified daemon name and installs it in the
  user's LaunchAgents directory. Provides a reliable persistence mechanism
  that survives user logouts and system restarts.

  The module verifies that the shipped Mach-O template does not link
  Apple's Python 2.7 framework, which macOS 12.3 removed, and refuses to
  generate if it does, rather than plant a binary that cannot load.
software: ''
tactics: [TA0003, TA0004]
techniques: [T1543, T1543.001]
background: false
output_extension:
needs_admin: false
opsec_safe: false
language: python
min_language_version: '3'
comments: []
options:
  - name: Agent
    description: Agent to execute module on.
    required: true
    value: ''
  - name: Listener
    description: Listener to use.
    required: true
    value: ''
  - name: UserAgent
    description: User-agent string to use for the staging request (default, none,
      or other).
    required: false
    value: default
  - name: DaemonName
    description: Name of the Launch Daemon to install. Name will also be used for
      the plist file.
    required: true
    value: com.proxy.initialize
advanced:
  custom_generate: true
